# tests/lair.conf — what the engine's tools need to know about pack, as
# shell KEY=VALUE lines (tools/perf, tools/pty and tools/perf-idle read it).
# RUN_ARGS: passed to every run the pty rows and the perf rows start (the
#   run at once, no title card, as every build before pk03 did).
# TRAP_AT: the trap row's planted tick.
# AGREE_CASE, AGREE_TICKS: the agree rows' replay and its length.
# BENCH_ARGS: the perf gate's bench — a dozen shadows chasing and three
#   deer from row 900, inside the dusk blend (pk03).
RUN_ARGS="--no-title"
TRAP_AT=20
AGREE_CASE=steer-forest
AGREE_TICKS=120
BENCH_ARGS="--seed 7 --bench-shadows 12 --bench-deer 3 --start 900"
