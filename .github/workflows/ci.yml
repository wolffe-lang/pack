# pack — CI. The tiers are ci/tiers.py's (clef's planner, the house rule):
#   tier pr    a pull request: the planner's test and the Linux leg (fmt,
#              the unit tests on the checked machine, both builds, the
#              goldens on both tiers, the pty rows in the container);
#   tier full  a trunk push, the nightly, a dispatch, the `full-matrix`
#              label: the above plus the macOS leg (the build, the goldens
#              and the pty rows on a macOS runner) and the perf gate.
# Every step runs bare and its exit code is read directly: no pipes. A red
# nightly opens one issue (ci/nightly-red.sh).
name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [trunk]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Job ids, space separated; empty runs every job'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}-{1}', github.head_ref, (github.event.action == 'labeled' && github.event.label.name != 'full-matrix') && format('noop-{0}', github.run_id) || (contains(github.event.pull_request.labels.*.name, 'full-matrix') && 'full' || 'pr')) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IN_JOBS: ${{ inputs.jobs }}
        run: python3 ci/tiers.py plan --merge --github-output "$GITHUB_OUTPUT"
  plan-test:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs || '[]'), 'plan-test')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I ci/tiers-test.py
  linux:
    name: linux x86-64 (fmt, tests, builds, goldens, pty rows in the container)
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs || '[]'), 'linux')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .wolf-bin
          key: pack-toolchain-linux-${{ hashFiles('wolf-toolchain.toml') }}
      - name: the pinned toolchain, by digest
        run: tools/fetch-toolchain
      - name: the Linux leg, in the container
        env:
          PACK_ENGINE: docker
        run: tools/in-container tools/check-linux
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: linux-evidence
          path: |
            target/goldens
            target/pty
            target/test.log
  macos:
    name: macOS arm64 (build, goldens, pty rows)
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs || '[]'), 'macos')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .wolf-bin
          key: pack-toolchain-macos-${{ hashFiles('wolf-toolchain.toml') }}
      - name: the pinned toolchain, by digest
        run: tools/fetch-toolchain
      - name: wolf fmt --check
        run: tools/check-fmt
      - name: the unit tests
        run: tools/test
      - name: build, both tiers
        run: tools/build --all
      - name: the goldens, both tiers
        run: tools/goldens
      - name: the pty rows
        run: python3 -I tools/pty --bin target/release/pack
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: macos-evidence
          path: |
            target/goldens
            target/pty
  perf:
    name: perf gate (render and idle, release)
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs || '[]'), 'perf')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .wolf-bin
          key: pack-toolchain-linux-${{ hashFiles('wolf-toolchain.toml') }}
      - name: the pinned toolchain, by digest
        run: tools/fetch-toolchain
      - name: the perf gate, in the container
        env:
          PACK_ENGINE: docker
          PACK_PERF_SLACK: '3'
        run: tools/in-container tools/perf
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: perf-evidence
          path: target/perf
  tier:
    name: tier ${{ needs.plan.outputs.tier || 'unplanned' }}
    if: ${{ !cancelled() }}
    needs:
      - plan
      - plan-test
      - linux
      - macos
      - perf
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 ci/tiers.py verdict
  nightly-red:
    name: nightly red, an issue
    needs: tier
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ci/nightly-red.sh
