aarch64-apple-darwin = "9133bfdbb95f6a18745439bf0b2b5280860a5bfeaf9ae038ea120a72d58f7687"
x86_64-unknown-linux-gnu = "ad703550ac4787e8e4bb26989d591a731410274d7332f2b4e8b9a64c878822cc"
